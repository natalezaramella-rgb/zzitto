# Configurazione dei modelli di Zzitto — Spec §3, §7, §7.1, §13.
# Aggiunto il 22/10/2026 alle 11:29.
#
# Formato: righe KEY="valore" (lette da prepare-models.sh con `source` e da prepare-models.ps1 con una regex).
# Niente spazi attorno a "=", niente espansioni di variabili nei valori.
#
# Fonti verificate il 22/10/2026 (pagine Hugging Face e GitHub):
#   - https://huggingface.co/ggerganov/whisper.cpp  (licenza MIT; ggml-medium-q5_0.bin, 539 MB)
#   - https://huggingface.co/microsoft/Phi-4-mini-instruct  (licenza MIT; solo safetensors, nessun GGUF ufficiale)
#   - https://github.com/ggml-org/llama.cpp  (MIT; convert_hf_to_gguf.py e llama-quantize)
#   - https://github.com/ggml-org/whisper.cpp  (MIT; strumento quantize)

# ---- Whisper medium Q5_0 (riconoscimento vocale, Spec §3) ----
WHISPER_FILE="whisper-medium-q5_0.bin"
# "download": scarica la versione Q5_0 già quantizzata e pubblicata dal progetto whisper.cpp (predefinito).
# "quantize": scarica ggml-medium.bin (F16) e lo quantizza in locale con whisper.cpp.
WHISPER_MODE="download"
WHISPER_HF_REPO="ggerganov/whisper.cpp"
# Commit che ha pubblicato i file attuali ("Add back properly named models", #9).
WHISPER_HF_REVISION="f281eb45af861ab5e5297d23694b7d46e090c02c"
WHISPER_HF_FILE="ggml-medium-q5_0.bin"
# SHA-256 (oid LFS) mostrato da Hugging Face per ggml-medium-q5_0.bin il 22/10/2026.
WHISPER_SOURCE_SHA256="19fea4b380c3a618ec4723c3eef2eb785ffba0d0538cf43f8f235e7b3b34220f"
WHISPER_HF_SOURCE_FILE_F16="ggml-medium.bin"
WHISPER_CPP_REPO="https://github.com/ggml-org/whisper.cpp.git"
WHISPER_CPP_REF="v1.9.5"

# ---- Phi-4-mini-instruct Q4_K_M (correzione del testo, Spec §3, §5.3) ----
PHI_FILE="phi-4-mini-instruct-q4_k_m.gguf"
PHI_HF_REPO="microsoft/Phi-4-mini-instruct"
PHI_HF_REVISION="cfbefacb99257ffa30c83adab238a50856ac3083"
PHI_HF_FILES="config.json generation_config.json model.safetensors.index.json model-00001-of-00002.safetensors model-00002-of-00002.safetensors tokenizer.json tokenizer_config.json special_tokens_map.json added_tokens.json vocab.json merges.txt LICENSE NOTICE.md"
# SHA-256 (oid LFS) dei pesi originali, letti dalle pagine Hugging Face il 22/10/2026.
# Se non corrispondono lo script si ferma: confrontarli con "File info" sulla pagina del file.
PHI_SOURCE_SHA256_1="bc703090b63eda16f639fa4de7ac54635c23105ab1da2f6ec4d3403151d38ee6"
PHI_SOURCE_SHA256_2="7ff79b9d2d31076bac2663393451f6530f4fc8ca49b09002116c92c373dba983"
PHI_QUANT="Q4_K_M"
# Formato intermedio prima della quantizzazione (i pesi originali sono in bfloat16).
PHI_INTERMEDIATE_TYPE="bf16"
LLAMA_CPP_REPO="https://github.com/ggml-org/llama.cpp.git"
# Deve coincidere con la versione di llama.cpp usata dal motore (agente A). Se core-native contiene
# third_party/llama.cpp, gli script usano quella copia e ignorano questo valore.
LLAMA_CPP_REF="b11815"  # allineato al sottomodulo core-native/third_party/llama.cpp (integrazione 22/10/2026 12:17)

# ---- Pacchettizzazione Android (Spec §7) ----
# Limite Google Play per singolo asset pack: 1,5 GB compressi. Phi-4-mini va diviso in parti.
PHI_PART_COUNT="2"
ANDROID_PACK_LIMIT_BYTES="1500000000"
ANDROID_INSTALL_TIME_LIMIT_BYTES="4000000000"
